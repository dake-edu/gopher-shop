{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-8">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item"><a href="/book/{{.Book.ID}}">{{.Book.Title}}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Checkout</li>
            </ol>
        </nav>

        <div class="card bg-info-subtle">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0">Checkout demonstration</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-light border">
                    <strong>Item:</strong> {{.Book.Title}}<br>
                    <strong>Total:</strong> <span class="text-success fw-bold">${{.Book.Price}}</span>
                </div>

                <form action="/checkout" method="POST" class="row g-3 needs-validation">
                    <input type="hidden" name="book_id" value="{{.Book.ID}}">

                    <p>This local demo queues a job in memory. It does not charge money,
                        save a purchase, or collect card details.</p>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-info btn-lg w-100">Queue demonstration job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
