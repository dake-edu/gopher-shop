name: Book checkpoints

on:
  push:
    paths:
      - 'book/**'
      - '.github/workflows/book-check.yml'
  pull_request:
    paths:
      - 'book/**'
      - '.github/workflows/book-check.yml'

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check registered chapters and executable examples
        run: python book/tools/check.py
      - name: Install publication tools
        if: runner.os == 'Linux'
        run: python -m pip install -r book/requirements-build.txt
      - name: Build review formats
        if: runner.os == 'Linux'
        run: python book/tools/build_preview.py
      - name: Validate review packages
        if: runner.os == 'Linux'
        run: python book/tools/validate_preview.py
