<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Получили ключ — вернём при любом выходе</title><desc id="desc">Ошибка чтения не отменяет обязанность закрыть файл</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00758D"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#00758D">Получили ключ — вернём при любом выходе</text>
<rect x="15" y="60" width="185" height="70" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="107.5" y="84.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Открыли файл</text>
<text x="107.5" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Получили ресурс</text>
<rect x="265" y="60" width="185" height="70" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="357.5" y="84.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Прочитали</text>
<text x="357.5" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Успех или ошибка</text>
<rect x="515" y="60" width="190" height="70" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="610.0" y="84.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">defer: Close</text>
<text x="610.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Вернули ресурс</text>
<rect x="265" y="200" width="185" height="60" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="357.5" y="219.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Возврат результата</text>
<text x="357.5" y="241.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Все причины видны</text>
<line x1="200" y1="95" x2="265" y2="95" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="450" y1="95" x2="515" y2="95" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="130" x2="450" y2="220" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360.0" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00758D">Ошибка чтения не отменяет обязанность закрыть файл</text></svg>
