<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
<title id="title">Данные и представление</title><desc id="desc">Сначала готовим страницу; затем отправляем ответ.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00758D"/></marker></defs>
<rect width="720" height="230" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#00758D">Данные и представление</text>
<rect x="15" y="65" width="210" height="100" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="120.0" y="104.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Book → pageData</text>
<text x="120.0" y="126.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">обычные строки</text>
<rect x="255" y="65" width="210" height="100" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="360.0" y="104.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">html/template</text>
<text x="360.0" y="126.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">экранирование</text>
<rect x="495" y="65" width="210" height="100" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="600.0" y="104.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">bytes.Buffer → HTTP</text>
<text x="600.0" y="126.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">готовый HTML</text>
<line x1="225" y1="115" x2="255" y2="115" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="465" y1="115" x2="495" y2="115" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360.0" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00758D">Сначала готовим страницу; затем отправляем ответ.</text></svg>
