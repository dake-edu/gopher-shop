<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265" role="img" aria-labelledby="title desc">
<title id="title">Название: проверка до сохранения</title><desc id="desc">Любой отказ — название не принимаем</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#125d63"/></marker></defs>
<rect width="720" height="265" fill="#faf9f5"/>
<text x="360.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#125d63">Название: проверка до сохранения</text>
<rect x="15" y="75" width="155" height="110" rx="8" fill="#eaf0ef" stroke="#125d63" stroke-width="2"/>
<text x="92.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">Корректный</text>
<text x="92.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">UTF-8</text>
<rect x="195" y="75" width="155" height="110" rx="8" fill="#eaf0ef" stroke="#125d63" stroke-width="2"/>
<text x="272.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">Убираем пробелы</text>
<text x="272.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">по краям</text>
<rect x="375" y="75" width="155" height="110" rx="8" fill="#eaf0ef" stroke="#125d63" stroke-width="2"/>
<text x="452.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">Проверяем</text>
<text x="452.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">1–80 рун</text>
<rect x="555" y="75" width="150" height="110" rx="8" fill="#eaf0ef" stroke="#125d63" stroke-width="2"/>
<text x="630.0" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">Нет внутренних</text>
<text x="630.0" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#125d63">управляющих</text>
<line x1="170" y1="130" x2="195" y2="130" stroke="#125d63" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="130" x2="375" y2="130" stroke="#125d63" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="530" y1="130" x2="555" y2="130" stroke="#125d63" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#125d63">Любой отказ — название не принимаем</text></svg>
