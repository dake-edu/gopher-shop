<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265" role="img" aria-labelledby="title desc">
<title id="title">Название: проверка до сохранения</title><desc id="desc">Любой отказ — название не принимаем</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00758D"/></marker></defs>
<rect width="720" height="265" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#00758D">Название: проверка до сохранения</text>
<rect x="15" y="75" width="155" height="110" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="92.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Корректный</text>
<text x="92.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">UTF-8</text>
<rect x="195" y="75" width="155" height="110" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="272.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Убираем пробелы</text>
<text x="272.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">по краям</text>
<rect x="375" y="75" width="155" height="110" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="452.5" y="119.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Проверяем</text>
<text x="452.5" y="141.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">1–80 рун</text>
<rect x="555" y="75" width="150" height="110" rx="8" fill="#ffffff" stroke="#00758D" stroke-width="2"/>
<text x="630.0" y="108.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">Нет управляющих</text>
<text x="630.0" y="130.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">и разделителей</text>
<text x="630.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="15" fill="#00758D">строк / абзацев</text>
<line x1="170" y1="130" x2="195" y2="130" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="350" y1="130" x2="375" y2="130" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="530" y1="130" x2="555" y2="130" stroke="#00758D" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00758D">Любой отказ — название не принимаем</text></svg>
